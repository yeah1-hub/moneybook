name: 주식 시세 업데이트
on:
  schedule:
    # 평일 장중(한국 9시~16시) 20분마다 + 미국장 마감 뒤(한국 아침 7시)
    - cron: "*/20 0-7 * * 1-5"
    - cron: "5 22 * * 0-4"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_prices.py
      - name: 바뀐 시세 저장
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet && exit 0
          git commit -m "시세 업데이트"
          git pull --rebase origin main
          git push
